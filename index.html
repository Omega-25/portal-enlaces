<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Enlaces</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="desktop-background"></div>
    
    <!-- PANTALLA DE LOGIN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-window">
            <div class="login-title-bar">Portal de Enlaces - Iniciar Sesión</div>
            <div class="login-content">
                <div class="login-icon">🔐</div>
                
                <div class="login-form" id="loginForm">
                    <div class="form-group">
                        <label>Usuario:</label>
                        <input type="text" id="loginUsername" placeholder="usuario" autofocus>
                    </div>
                    <div class="form-group">
                        <label>Contraseña:</label>
                        <input type="password" id="loginPassword" placeholder="contraseña">
                    </div>
                    <button id="loginBtn" class="btn-login">Iniciar Sesión</button>
                    <button id="registerToggleBtn" class="btn-register">¿No tienes cuenta? Regístrate</button>
                    <div id="loginMessage" class="message"></div>
                </div>

                <div class="login-form" id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label>Usuario:</label>
                        <input type="text" id="registerUsername" placeholder="usuario">
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="registerEmail" placeholder="email@ejemplo.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña:</label>
                        <input type="password" id="registerPassword" placeholder="contraseña">
                    </div>
                    <div class="form-group">
                        <label>Confirmar:</label>
                        <input type="password" id="registerConfirmPassword" placeholder="confirmar">
                    </div>
                    <button id="registerBtn" class="btn-login">Registrarse</button>
                    <button id="loginBackBtn" class="btn-register">Volver al login</button>
                    <div id="registerMessage" class="message"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="mainScreen" class="main-screen" style="display: none;">
        <div class="floating-icon" id="floatingIcon" style="display: none;">📦</div>

        <div class="window-container" id="windowContainer">
            <div class="title-bar" id="titleBar">
                <span>Portal de Enlaces</span>
                <div class="title-controls">
                    <button id="minBtn" class="btn-control">_</button>
                    <button id="maxBtn" class="btn-control">□</button>
                    <button id="logoutBtn" class="btn-control" title="Logout">🚪</button>
                    <button id="closeBtn" class="btn-control">✕</button>
                </div>
            </div>

            <div class="window-content" id="windowContent">
                <div id="syncStatus" class="sync-status">🔄 Cargando...</div>
                <div id="buttonsGrid" class="buttons-grid"></div>
                
                <button id="expandAddBtn" class="btn-add">➕ Agregar Enlace</button>

                <div id="addSection" class="add-section" style="display: none;">
                    <div class="form-group">
                        <label>Nombre:</label>
                        <input type="text" id="btnName" placeholder="Google">
                    </div>
                    <div class="form-group">
                        <label>URL:</label>
                        <input type="text" id="btnUrl" placeholder="https://google.com">
                    </div>
                    <div class="form-group">
                        <label>Emoji:</label>
                        <div class="emoji-container">
                            <input type="text" id="btnEmoji" placeholder="🔗" maxlength="2
